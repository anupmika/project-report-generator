[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-report"
version = "0.1.0"
description = "Generate comprehensive project reports from GitHub repository links"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "gitpython>=3.1.43",
    "pydantic>=2.8.0",
    "rich>=13.7.0",
    "jinja2>=3.1.4",
    "click>=8.1.7",
    "pygithub>=2.3.0",
    "python-docx>=1.1.2",
    "weasyprint>=62.3",
    "markdown>=3.6",
    "streamlit>=1.37.0",
    "pymdown-extensions>=10.8",
]

[project.scripts]
project-report = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

dev-dependencies = [
    "pytest>=8.2.0",
]
